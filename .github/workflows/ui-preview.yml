name: UI preview checks
on:
  workflow_dispatch:
  push:
    branches: [codex/basic-premium-foundation]
    paths:
      - 'src/**'
      - 'index.html'
      - 'checks/**'
      - 'scripts/build-ui-preview.mjs'
      - '.github/workflows/ui-preview.yml'
permissions:
  contents: read
jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node --test tests/currency.test.js tests/payments.test.js tests/booking-values.test.js tests/access.test.js tests/domain.test.js tests/i18n.test.js
      - run: node scripts/build-ui-preview.mjs
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test checks/currency.spec.mjs checks/payments.spec.mjs checks/booking-details.spec.mjs checks/access.spec.mjs checks/responsive.spec.mjs checks/i18n.spec.mjs checks/native-auth.spec.mjs checks/ui-preview.spec.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Apartment-Booking-Manager-UI-preview
          path: |
            ui-preview/*.html
            test-results/
          retention-days: 30
