name: UI preview checks
on:
  workflow_dispatch:
  push:
    branches: [codex/basic-premium-foundation]
    paths:
      - 'src/**'
      - 'tests/owners.test.js'
      - 'tests/fixtures/owners.mjs'
      - 'index.html'
      - 'checks/**'
      - 'scripts/build-ui-preview.mjs'
      - '.github/workflows/ui-preview.yml'
permissions:
  contents: read
jobs:
  preview:
    runs-on: ubuntu-latest
    # Explicit presentation-only deliveries run the focused UI suite; other commits retain all checks.
    env:
      MENU_UI_ONLY: ${{ github.event_name == 'push' && startsWith(github.event.head_commit.message, '[menu-ui]') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - run: node --test tests/owners.test.js tests/backup-large.test.js tests/backup-native.test.js tests/backup-stream.test.js tests/backup.test.js tests/backup-resources.test.js tests/maintenance-drafts.test.js tests/photo-picker.test.js tests/photo-picker-native.test.js tests/maintenance.test.js tests/entry-screen.test.js tests/booking-colors.test.js tests/manual-dates.test.js tests/report-pdf.test.js tests/report-excel.test.js tests/reservations-report.test.js tests/report-consecutive.test.js tests/report-multicurrency.test.js tests/report-presentation.test.js tests/statistics.test.js tests/collections.test.js tests/currency.test.js tests/payments.test.js tests/booking-values.test.js tests/access.test.js tests/domain.test.js tests/i18n.test.js
        if: env.MENU_UI_ONLY != 'true'
      - run: python3 -m pip install --quiet pypdf==6.10.0
        if: env.MENU_UI_ONLY != 'true'
      - run: python3 checks/verify-owner-pdfs.py
        if: env.MENU_UI_ONLY != 'true'
      - run: node scripts/build-ui-preview.mjs
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test checks/menu-layout.spec.mjs checks/owners.spec.mjs checks/backup.spec.mjs checks/maintenance-drafts.spec.mjs checks/photo-picker.spec.mjs checks/maintenance.spec.mjs checks/booking-paths-dates.spec.mjs checks/report-pdf.spec.mjs checks/report-excel.spec.mjs checks/reservations-report.spec.mjs checks/statistics-chart-spacing.spec.mjs checks/statistics-chart-values.spec.mjs checks/statistics.spec.mjs checks/collections.spec.mjs checks/currency.spec.mjs checks/payments.spec.mjs checks/booking-details.spec.mjs checks/access.spec.mjs checks/responsive.spec.mjs checks/i18n.spec.mjs checks/native-auth.spec.mjs checks/ui-preview.spec.mjs checks/premium-visual.spec.mjs checks/android-finish.spec.mjs checks/entry-screen.spec.mjs checks/premium-contrast.spec.mjs checks/readability.spec.mjs checks/fold-regressions.spec.mjs checks/report-multicurrency.spec.mjs checks/report-presentation.spec.mjs checks/apartment-photo.spec.mjs
        if: env.MENU_UI_ONLY != 'true'
      - run: python3 checks/verify-owner-pdfs.py --ui
        if: env.MENU_UI_ONLY != 'true'
      - name: Focused menu UI checks
        if: env.MENU_UI_ONLY == 'true'
        run: npx playwright test checks/menu-layout.spec.mjs checks/native-auth.spec.mjs checks/commerce.spec.mjs checks/entry-screen.spec.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Apartment-Booking-Manager-UI-preview
          path: |
            ui-preview/*.html
            test-results/
          retention-days: 30
