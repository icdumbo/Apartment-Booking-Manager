name: Cloudflare access checks (no APK)
on:
  push:
    branches: [codex/basic-premium-foundation]
    paths: ['backend/**', 'tests/secure-trial.test.js', 'tests/firebase-access.test.js', '.github/workflows/access-checks.yml']
permissions:
  contents: read
jobs:
  access:
    runs-on: ubuntu-latest
    env:
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm ci --prefix backend --ignore-scripts
      - run: node --input-type=module -e "import('./backend/index.js')"
      - run: npm run check --prefix backend
