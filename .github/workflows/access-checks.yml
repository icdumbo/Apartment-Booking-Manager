name: Secure access checks (no APK)
on:
  push:
    branches: [codex/basic-premium-foundation]
    paths: ['backend/**', 'src/*access.js', 'src/native-auth.js', 'tests/secure-trial.test.js', 'android/app/src/**', '.github/workflows/access-checks.yml']
permissions:
  contents: read
jobs:
  access:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - run: npm ci --prefix backend --ignore-scripts
      - run: node --test tests/access.test.js tests/firebase-access.test.js tests/native-auth.test.js tests/secure-trial.test.js tests/i18n.test.js
      - run: node --input-type=module -e "import('./backend/index.js')"
      - run: npm run android:sync
      - name: Compile native access and run clock unit tests without packaging APK
        working-directory: android
        run: chmod +x gradlew && ./gradlew :app:testDebugUnitTest
