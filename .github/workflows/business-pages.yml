name: Publish BUSINESS to GitHub Pages

on:
  push:
    branches: [codex/business-ui-redesign]
    paths: [.github/workflows/business-pages.yml]

permissions:
  contents: read

concurrency:
  group: business-pages
  cancel-in-progress: false

jobs:
  package:
    if: contains(github.event.head_commit.message, '[publish-pages]')
    runs-on: ubuntu-latest
    env:
      INCLUDE_APPROVED_LEGAL: 'false'
    steps:
      - uses: actions/checkout@v6
        with:
          ref: a916a48ab1629adcbe94be78837160d50101b554
          persist-credentials: false
      - name: Package verified BUSINESS web files
        run: |
          mkdir _site
          git archive HEAD index.html src | tar -x -C _site --exclude=src/legal
          touch _site/.nojekyll
          test -s _site/index.html
          test -s _site/src/app.js
          test ! -e _site/src/legal
          test ! -e _site/legal
          release="business-$(git rev-parse --short=12 HEAD)"
          mkdir "_site/$release"
          mv _site/src "_site/$release/src"
          sed -i -e "s|href=\"src/styles.css|href=\"$release/src/styles.css|" \
            -e "s|src=\"src/app.js|src=\"$release/src/app.js|" _site/index.html
          grep -F "$release/src/app.js" _site/index.html
          grep -F "$release/src/styles.css" _site/index.html
      - uses: actions/setup-node@v4
        if: env.INCLUDE_APPROVED_LEGAL == 'true'
        with:
          node-version: '22'
      - name: Include approved bilingual legal pages
        if: env.INCLUDE_APPROVED_LEGAL == 'true'
        run: |
          node scripts/prepare-legal-pages.mjs --release
          mkdir _site/legal
          cp -R build/legal-pages-release/legal/. _site/legal/
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: package
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy verified BUSINESS site
        id: deployment
        uses: actions/deploy-pages@v4
