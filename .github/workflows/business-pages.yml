name: Publish BUSINESS to GitHub Pages

on:
  push:
    branches: [codex/business-ui-redesign]
    paths: [.github/workflows/business-pages.yml]

permissions:
  contents: read

concurrency:
  group: business-pages
  cancel-in-progress: false

jobs:
  package:
    if: contains(github.event.head_commit.message, '[publish-pages]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ce51edbaf94cf7e349e8f2689ad471d6de407ab6
          persist-credentials: false
      - name: Package verified BUSINESS web files
        run: |
          mkdir _site
          git archive HEAD index.html src | tar -x -C _site --exclude=src/legal
          touch _site/.nojekyll
          test -s _site/index.html
          test -s _site/src/app.js
          test ! -e _site/src/legal
          test ! -e _site/legal
          release="business-$(git rev-parse --short=12 HEAD)"
          mkdir "_site/$release"
          mv _site/src "_site/$release/src"
          sed -i -e "s|href=\"src/styles.css|href=\"$release/src/styles.css|" \
            -e "s|src=\"src/app.js|src=\"$release/src/app.js|" _site/index.html
          grep -F "$release/src/app.js" _site/index.html
          grep -F "$release/src/styles.css" _site/index.html
      - uses: actions/checkout@v6
        with:
          ref: d79585f8cb8858023fc36926da5b137052aeebe3
          path: legal-source
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Include audited bilingual documents with review notice
        working-directory: legal-source
        run: |
          node scripts/prepare-legal-pages.mjs --preview
          mkdir ../_site/legal
          for page in privacy-ro privacy-en delete-account-ro delete-account-en; do
            install -m 644 "build/legal-pages-preview/legal/$page.html" "../_site/legal/$page.html"
          done
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: package
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy verified BUSINESS site
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify public HTTPS documents and language links
        env:
          SITE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          mkdir verified-legal
          for page in privacy-ro privacy-en delete-account-ro delete-account-en; do
            url="${SITE_URL%/}/legal/$page.html"
            test "${url#https://}" != "$url"
            status=$(curl --silent --show-error --fail --retry 8 --retry-all-errors --retry-delay 5 --max-time 15 --output "verified-legal/$page.html" --write-out '%{http_code}' "$url")
            test "$status" = 200
            grep -F '<html lang="'"${page##*-}"'"' "verified-legal/$page.html" >/dev/null
            grep -F 'href="'"${page%-*}"'-ro.html"' "verified-legal/$page.html" >/dev/null
            grep -F 'href="'"${page%-*}"'-en.html"' "verified-legal/$page.html" >/dev/null
            grep -F 'support.apartmentbookingmanager@gmail.com' "verified-legal/$page.html" >/dev/null
            echo "HTTP $status $url; RO and EN links verified"
          done
