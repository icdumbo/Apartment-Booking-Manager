name: Android debug APK
on:
  workflow_dispatch:
  push:
    branches: [main, codex/basic-premium-foundation]
    paths:
      - 'android/**'
      - 'src/**'
      - 'index.html'
      - 'scripts/build-web.mjs'
      - 'checks/**'
      - 'playwright.config.mjs'
      - 'capacitor.config.json'
      - 'package*.json'
      - '.github/workflows/android-debug.yml'
permissions:
  contents: read
jobs:
  debug-apk:
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch' || (github.ref == 'refs/heads/codex/basic-premium-foundation' && contains(github.event.head_commit.message, '[android-test]'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - run: npm test
        if: github.ref == 'refs/heads/main'
      - run: node --test tests/access.test.js tests/firebase-access.test.js tests/native-auth.test.js tests/i18n.test.js tests/domain.test.js
        if: github.ref != 'refs/heads/main'
      - run: npx playwright install --with-deps chromium
      - run: npm run test:responsive
        if: github.ref == 'refs/heads/main'
      - run: npx playwright test checks/native-auth.spec.mjs
        if: github.ref != 'refs/heads/main'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Responsive-layout-checks
          path: test-results/*.png
          retention-days: 30
      - run: npm run android:sync
      - name: Build debug APK
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Apartment-Booking-Manager-unsigned-candidate
          path: android/app/build/outputs/apk/debug/*unsigned.apk
          if-no-files-found: error
          retention-days: 30

      - name: Prepare official SDK signing tool
        run: |
          mkdir -p signing-tool
          cp "$ANDROID_HOME/build-tools/36.0.0/lib/apksigner.jar" signing-tool/apksigner.jar
      - uses: actions/upload-artifact@v4
        with:
          name: Android-SDK-apksigner
          path: signing-tool/apksigner.jar
          retention-days: 30
