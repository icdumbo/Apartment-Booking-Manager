apply plugin: 'com.android.application'

// Private signing configuration lives outside Git. Never generate a replacement key.
def signingPropertiesFile = new File(rootProject.projectDir.parentFile, '.android-signing/signing.properties')
def signingProperties = new Properties()
if (signingPropertiesFile.exists()) {
    signingPropertiesFile.withInputStream { signingProperties.load(it) }
}

def commercialAdsEnabled = (project.findProperty('abmAdsEnabled') ?: 'false') == 'true'
def commercialAdsAppId = project.findProperty('abmAdMobAppId') ?: ''
def commercialAdsBannerId = project.findProperty('abmAdMobBannerId') ?: ''
if (commercialAdsEnabled && (!(commercialAdsAppId ==~ /ca-app-pub-[0-9]{16}~[0-9]{10}/) || !(commercialAdsBannerId ==~ /ca-app-pub-[0-9]{16}\/[0-9]{10}/))) {
    throw new GradleException('Configure public AdMob app/banner IDs before enabling ads')
}
android {
    buildFeatures { buildConfig true }
    if (!commercialAdsEnabled) { sourceSets.main.java.exclude '**/BookingAdsPlugin.java' }
    namespace = "ro.icdapps.apartmentbookingmanager"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "ro.icdapps.apartmentbookingmanager"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 22
        versionName "1.0.21"
        buildConfigField 'boolean', 'COMMERCIAL_ADS_ENABLED', commercialAdsEnabled.toString()
        resValue 'string', 'admob_banner_id', commercialAdsBannerId
        manifestPlaceholders = [abmAdMobAppId: commercialAdsAppId]
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        if (signingPropertiesFile.exists()) {
            basicTest {
                storeFile new File(signingPropertiesFile.parentFile, signingProperties['storeFile'])
                storePassword signingProperties['storePassword']
                keyAlias signingProperties['keyAlias']
                keyPassword signingProperties['keyPassword']
            }
        }
    }
    buildTypes {
        debug {
            // Without the private key, produce only an unsigned candidate.
            signingConfig signingPropertiesFile.exists() ? signingConfigs.basicTest : null
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    if (commercialAdsEnabled) {
        implementation 'com.google.android.gms:play-services-ads:25.5.0'
        implementation 'com.google.android.ump:user-messaging-platform:4.0.0'
    }
    implementation 'com.android.billingclient:billing:8.3.0'
    implementation platform('com.google.firebase:firebase-bom:35.0.2')
    implementation 'com.google.firebase:firebase-auth'
    implementation 'androidx.credentials:credentials:1.3.0'
    implementation 'androidx.credentials:credentials-play-services-auth:1.3.0'
    implementation 'com.google.android.libraries.identity.googleid:googleid:1.1.1'
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
